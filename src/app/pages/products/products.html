<div class="container">
  <h2>Products</h2>

  @if (products$ | async; as products) {
    
    @for (p of products; track p.id) {
      <div class="card mb-2 p-2">
        <h5>{{p.name}}</h5>
        <p>₹{{p.price}}</p>

        <button class="btn btn-success" (click)="addToCart(p)">
          Add to Cart
        </button>
      </div>
    }

  } 
</div>
