<div class="container">
  <h2>My Cart</h2>

  @if (cart$ | async; as cart) {
    @if (cart.items?.length > 0) {
      @for (p of cart.items; track p.productId) {
        <div class="card mb-2 p-2">
          <h5>Product ID: {{ p.productId }}</h5>
          <p>Quantity: {{ p.quantity }}</p>

          <button class="btn btn-danger" (click)="remove(p.productId)">Remove</button>
        </div>
      }

      <button class="btn btn-warning mt-3" (click)="clearCart()">Clear Cart</button>
      <br />
      <button class="btn btn-success mt-3" (click)="checkout()">Checkout</button>
      <br />
      <button class="btn btn-primary mt-3" (click)="goToProducts()">Continue Shopping</button>
    } @else {
      <div class="text-center mt-5">
        <h3>Your cart is empty 🛒</h3>
        <p class="text-muted">Looks like you haven’t added anything yet</p>

        <button class="btn btn-primary mt-3" (click)="goToProducts()">Browse Products</button>
      </div>
    }
  }
</div>
